[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "text-recognition-core"
version = "0.1.0"
description = "Typed, offline-first text recognition core contracts"
requires-python = ">=3.13,<4"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
raster-worker = ["pillow==12.3.0"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "pytest>=9.0.3,<10",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "editables~=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/text_recognition_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["text_recognition_core"]
mypy_path = "src"
